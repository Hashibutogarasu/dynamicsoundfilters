name: Build and Release

on:
  push:
    branches: [main, master, 1.21.5]
    tags: ["v*"]
  pull_request:
    branches: [main, master, 1.21.5]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Generate Javadoc
        run: ./gradlew javadoc

      - name: Get mod version
        id: version
        run: |
          echo "MOD_VERSION=$(grep '^mod_version' gradle.properties | cut -d'=' -f2 | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')" >> $GITHUB_OUTPUT
          echo "MINECRAFT_VERSION=$(grep '^minecraft_version' gradle.properties | cut -d'=' -f2 | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')" >> $GITHUB_OUTPUT
          echo "Current ref: ${{ github.ref }}"
          echo "Is tag: ${{ startsWith(github.ref, 'refs/tags/') }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DynamicSoundFilters-${{ steps.version.outputs.MOD_VERSION }}+${{ steps.version.outputs.MINECRAFT_VERSION }}
          path: |
            build/libs/*.jar
            build/docs/javadoc/**
          retention-days: 30

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*[!-sources].jar
          retention-days: 30

      - name: Upload sources jar
        uses: actions/upload-artifact@v4
        with:
          name: sources-jar
          path: build/libs/*-sources.jar
          retention-days: 30

      - name: Upload javadoc
        uses: actions/upload-artifact@v4
        with:
          name: javadoc
          path: build/docs/javadoc/
          retention-days: 30

      # Create GitHub Release for tags
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
          body: |
            ## Dynamic Sound Filters ${{ steps.version.outputs.MOD_VERSION }}

            ### Downloads
            - **Mod JAR**: Main mod file for Minecraft ${{ steps.version.outputs.MINECRAFT_VERSION }}
            - **Sources JAR**: Source code archive

            ### Installation
            1. Download the main JAR file (without `-sources` suffix)
            2. Place it in your `.minecraft/mods` folder
            3. Requires Fabric Loader and Fabric API

            This is a fork of the original project by andre111: https://bitbucket.org/andre111/dynamicsoundfilters
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}